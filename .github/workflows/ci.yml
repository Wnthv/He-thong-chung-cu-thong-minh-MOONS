name: CI – Kiểm thử tự động Moons (Laravel)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moons
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      MOONS_FIXED_TODAY: '2026-11-04'

    steps:
      - uses: actions/checkout@v4

      - name: Cài PHP 8.3 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, intl, curl, mbstring, fileinfo
          tools: composer
          coverage: none

      - name: Cài thư viện Laravel (composer install)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tạo file .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kiểm tra cú pháp PHP
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tạo CSDL & sinh dữ liệu mô phỏng (migrate --seed)
        run: php artisan migrate --seed --force

      - name: Sao chép sang CSDL kiểm thử moons_test
        run: |
          mysqldump -h127.0.0.1 -uroot -proot --routines --triggers moons > seed.sql
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE moons_test CHARACTER SET utf8mb4"
          mysql -h127.0.0.1 -uroot -proot moons_test < seed.sql

      - name: Khởi động máy chủ web (CSDL moons_test)
        run: |
          cd public
          DB_DATABASE=moons_test nohup php -S 127.0.0.1:8080 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > ../php-server.log 2>&1 &
          sleep 2

      - name: Chạy 75 ca kiểm thử
        run: php artisan moons:test --db=moons_test --http=http://127.0.0.1:8080

      - name: Lưu kết quả kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-kiem-thu
          path: |
            tests/results.json
            php-server.log
            storage/logs/laravel.log
          if-no-files-found: ignore
